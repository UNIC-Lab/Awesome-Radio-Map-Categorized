name: Catalog checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/lint_readme.rb
      - run: ruby scripts/check_catalog.rb

  external-links-and-code:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/check_links.rb
      - run: ruby scripts/check_code_repositories.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
